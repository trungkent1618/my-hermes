name: my-hermes
version: 1.1.0
description: "Hermes profile with Agnes AI image/video generation through Agnes2API-Nexus and local media storage."
author: "WanderleeDev"
license: MIT
hermes_requires: ">=0.12.0"

env_requires:
  - name: AGNES_API_KEY
    description: "Agnes gateway client key"
    required: true
  - name: AGNES_BASE_URL
    description: "Agnes gateway base URL (e.g. http://127.0.0.1:8080/v1 for Agnes2API-Nexus)"
    required: false
  - name: AGNES_VIDEO_POLL
    description: "Optional. 'auto' uses gateway-returned completed video; 'direct' enables direct Agnes polling."
    required: false
  - name: MY_HERMES_DATA_DIR
    description: "Local media root for images and videos"
    required: false
